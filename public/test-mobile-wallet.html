<!DOCTYPE html>
<html>
<head>
    <title>Test Mobile Wallet Connection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #f6851b;
            color: white;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Mobile Wallet Connection Test</h1>
    
    <div class="info">
        <strong>Device Info:</strong><br>
        User Agent: <span id="userAgent"></span><br>
        Is Mobile: <span id="isMobile"></span><br>
        Window Width: <span id="width"></span>px
    </div>

    <button onclick="testMetaMaskDeepLink()">Test MetaMask Deep Link</button>
    <button onclick="testMetaMaskIntent()">Test MetaMask Intent (Android)</button>
    
    <div id="result" style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; display: none;"></div>

    <script>
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('isMobile').textContent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'Yes' : 'No';
        document.getElementById('width').textContent = window.innerWidth;

        function testMetaMaskDeepLink() {
            const currentUrl = window.location.href;
            const dappUrl = encodeURIComponent(window.location.origin + window.location.pathname);
            const deepLink = `https://metamask.app.link/dapp/${dappUrl}`;
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <strong>Universal Link:</strong><br>
                <a href="${deepLink}" target="_blank">${deepLink}</a><br><br>
                <strong>Click the link above to test</strong>
            `;
            
            // Try to open
            window.location.href = deepLink;
        }

        function testMetaMaskIntent() {
            const currentUrl = window.location.href;
            const intentUrl = `intent://dapp?url=${encodeURIComponent(currentUrl)}#Intent;scheme=metamask;package=io.metamask;end`;
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <strong>Android Intent:</strong><br>
                <a href="${intentUrl}">${intentUrl}</a><br><br>
                <strong>Click the link above to test</strong>
            `;
            
            // Try to open
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
